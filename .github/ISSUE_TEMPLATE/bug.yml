name: Bug report
description: Verbalis crashes, fails to install or build, or its API doesn't work as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [Python, TypeScript, C++]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Verbalis version, for example `0.1.0`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system and runtime, for example "macOS 15, Python 3.12" or "React Native 0.81, Hermes".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code that shows the problem, and the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
