name: Misreading
description: Verbalis reads a sentence wrong in your language.
labels: ["bug"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [de, en-us, en-gb, es, fr, hi, it, pl, pt, zh]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The text you passed to Verbalis, exactly as written.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What Verbalis reads
      description: The output of `process`. The C++, Python, and TypeScript packages give the same output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should read
      description: The reading you expect. If several readings are correct, list each one on its own line.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why
      description: Optional. The rule, a source such as a dictionary or style guide, or anything else that helps.
  - type: input
    id: version
    attributes:
      label: Version
      description: Optional. The Verbalis version you use, for example `0.1.0`.
