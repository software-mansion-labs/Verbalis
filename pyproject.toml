[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "verbalis"
version = "0.1.0"
description = "Rewrites text the way it is read aloud: numbers, dates, symbols, abbreviations, and web addresses as words."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "Software Mansion" }]
requires-python = ">=3.9"
keywords = ["tts", "text-normalization", "verbalization", "speech"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "python"
wheel.packages = ["python/verbalis"]
wheel.py-api = "cp312"
minimum-version = "build-system.requires"
# The sdist ships only what a build needs, and never tests/: the corpus's licence is unchecked
sdist.exclude = [
  "*",
  "!cpp/include/**", "!cpp/src/**", "!cpp/CMakeLists.txt", "!python/**",
  "!/README.md", "!LICENSE", "!THIRD_PARTY_NOTICES.md", "!licenses/**", "!pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux_i686 *-win32 *-manylinux_i686"
test-extras = ["test"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
